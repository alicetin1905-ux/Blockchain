<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>ChainScout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: sticky kopbalk, links filters, rechts een horizontale keten van blokken met daaronder de tokens (transacties) van het gekozen blok. */
:root{
  --bg:#050a10; --solid:#08121c; --panel:rgb(8 19 31/.74); --panel2:rgb(13 29 44/.82); --line:#16324a; --chain:#245577;
  --fg:#d6e9f3; --mute:#7b97ab; --accent:#5cc8e0; --accent-ink:#031219;
  --good:#3fe0a5; --warn:#fbbf24; --bad:#ff6b7f; --info:#7b97ab;
  --f-head:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#e9f1f6; --solid:#ffffff; --panel:rgb(255 255 255/.8); --panel2:rgb(238 245 250/.9); --line:#cbdbe6; --chain:#9bb8cc;
    --fg:#10243a; --mute:#5a7387; --accent:#0a7f9b; --accent-ink:#ffffff;
    --good:#0b8f66; --warn:#a96a05; --bad:#cf2e48; --info:#5a7387; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#e9f1f6; --solid:#ffffff; --panel:rgb(255 255 255/.8); --panel2:rgb(238 245 250/.9); --line:#cbdbe6; --chain:#9bb8cc;
  --fg:#10243a; --mute:#5a7387; --accent:#0a7f9b; --accent-ink:#ffffff;
  --good:#0b8f66; --warn:#a96a05; --bad:#cf2e48; --info:#5a7387; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--good)} .dn{color:var(--bad)} .mute{color:var(--mute)}
h1,h2,h3{font-family:var(--f-head);margin:0;font-weight:600;text-wrap:balance}

.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;max-width:1700px;margin:0 auto}

/* achtergrond: zwevende knooppunten in twee lagen, de verste laag is wazig */
.amb{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none}
#amb-far{filter:blur(2.5px);opacity:.75}
#app{position:relative;z-index:1}
.filters,.strip-box,.card,.panel,.tile,.netbox{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

/* kopbalk */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top .wrap{padding-bottom:0}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-head);font-weight:700;font-size:20px;letter-spacing:.04em}
.brand svg{width:26px;height:26px}
.brand small{font:500 11px var(--f-mono);color:var(--mute);letter-spacing:0;margin-left:2px}
.paper{font:700 10px var(--f-mono);letter-spacing:.12em;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 60%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:4px;padding:3px 8px;white-space:nowrap}
.status{display:flex;align-items:center;gap:8px;font:12px var(--f-mono);color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 22%,transparent)}
.dot.busy{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 22%,transparent);animation:pulse 1s infinite}
.dot.off{background:var(--mute);box-shadow:none}
@keyframes pulse{50%{opacity:.35}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:none;border:0;padding:4px 10px;font:600 11px var(--f-mono);letter-spacing:.06em;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.wallet{display:flex;gap:18px;margin-left:auto;flex-wrap:wrap}
.wallet div{display:flex;flex-direction:column;line-height:1.15}
.wallet span{font:500 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.wallet b{font:600 16px var(--f-head)}
.tabs{display:flex;gap:2px;width:100%;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;font:600 13px var(--f-head);letter-spacing:.05em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.good{background:color-mix(in srgb,var(--good) 18%,var(--panel2));border-color:var(--good);color:var(--good);font-weight:600}
.btn.bad{background:color-mix(in srgb,var(--bad) 14%,var(--panel2));border-color:color-mix(in srgb,var(--bad) 55%,var(--line));color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.banner{margin-top:12px;padding:9px 12px;border:1px solid color-mix(in srgb,var(--warn) 50%,var(--line));background:color-mix(in srgb,var(--warn) 10%,var(--panel));border-radius:6px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* scanner */
.scan{display:grid;grid-template-columns:292px minmax(0,1fr);gap:18px;padding-top:16px;align-items:start}
.filters{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 108px);max-height:calc(100vh - 130px);overflow:auto}
.filters h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin:16px 0 8px;color:var(--mute)}
.filters h3:first-child{margin-top:0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld label{font-size:11px;color:var(--mute)}
.fld input[type=number],.fld select,.fld input[type=text],.fld textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:5px 7px;font:13px var(--f-mono);min-width:0}
.fld textarea{resize:vertical;min-height:60px}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;grid-column:1/-1}
.chk input{accent-color:var(--accent)}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:2px 9px;font:500 11px var(--f-mono);color:var(--mute)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.filt-toggle{display:none}

.strip-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.strip-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.strip-head h2{font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.strip{display:flex;align-items:stretch;overflow-x:auto;padding:12px 2px 8px;scroll-behavior:smooth}
.blk{flex:0 0 176px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;display:flex;flex-direction:column;gap:3px;position:relative}
.blk:hover{border-color:var(--chain)}
.blk[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.blk .bh{font:700 13px var(--f-head);letter-spacing:.05em;display:flex;justify-content:space-between}
.blk .head-tag{font:600 9px var(--f-mono);background:var(--accent);color:var(--accent-ink);border-radius:3px;padding:1px 5px;letter-spacing:.08em}
.blk .hs{font:11px var(--f-mono);color:var(--accent)}
.blk .pv{font:10px var(--f-mono);color:var(--mute)}
.blk .bs{font:11px var(--f-mono);display:flex;justify-content:space-between;margin-top:3px}
.blk .bt{font:10px var(--f-mono);color:var(--mute)}
.blk.pending{border-style:dashed;background:transparent;justify-content:center;cursor:default;min-height:104px}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.lnk{flex:0 0 30px;align-self:center;height:2px;background:repeating-linear-gradient(90deg,var(--chain) 0 5px,transparent 5px 8px);position:relative}
.lnk::after{content:"";position:absolute;right:-1px;top:-3px;border:4px solid transparent;border-left:6px solid var(--chain)}
.bdetail{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px 18px;margin-top:6px;padding-top:12px;border-top:1px solid var(--line)}
.bdetail div{min-width:0}
.bdetail span{display:block;font:500 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.bdetail code{font:12px var(--f-mono);overflow-wrap:anywhere}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0 12px}
.toolbar .grow{flex:1 1 220px;min-width:0}
.toolbar input[type=search],.toolbar select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
.toolbar input[type=search]{width:100%}
.sw{display:flex;gap:7px;align-items:center;font-size:13px;white-space:nowrap}
.sw input{accent-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:9px;min-width:0;position:relative}
.card.pass{border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
.card.fail{opacity:.72}
.card.fail:hover{opacity:1}
.c-top{display:flex;gap:10px;align-items:center;min-width:0}
.ico{width:38px;height:38px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);object-fit:cover;flex:none;display:grid;place-items:center;font:700 14px var(--f-head);color:var(--mute);overflow:hidden}
.ico img{width:100%;height:100%;object-fit:cover}
.c-id{min-width:0;flex:1}
.c-id b{font:700 16px var(--f-head);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-id small{display:flex;gap:6px;align-items:center;color:var(--mute);font:11px var(--f-mono);white-space:nowrap}
.cb{font:600 9px var(--f-mono);letter-spacing:.06em;border-radius:3px;padding:1px 5px;color:var(--accent-ink)}
.ring{width:44px;height:44px;flex:none;position:relative}
.ring svg{width:44px;height:44px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 13px var(--f-head)}
.c-price{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.c-price b{font:600 18px var(--f-mono)}
.c-price span{font:12px var(--f-mono)}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kv div{background:var(--panel2);border-radius:6px;padding:5px 7px;min-width:0}
.kv span{display:block;font:500 9px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.kv b{font:500 12px var(--f-mono);white-space:nowrap}
.bs-bar{height:5px;border-radius:3px;background:var(--bad);overflow:hidden;display:flex}
.bs-bar i{background:var(--good);display:block}
.bs-lab{display:flex;justify-content:space-between;font:10px var(--f-mono);color:var(--mute);margin-top:4px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font:600 11px var(--f-body);border-radius:99px;padding:2px 9px;border:1px solid;display:inline-flex;gap:5px;align-items:center}
.pill.ok{color:var(--good);border-color:color-mix(in srgb,var(--good) 55%,transparent);background:color-mix(in srgb,var(--good) 10%,transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 55%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 55%,transparent);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.pill.unk{color:var(--mute);border-color:var(--line)}
.fails{display:flex;gap:5px;flex-wrap:wrap}
.fails span{font:11px var(--f-mono);color:var(--mute);background:var(--panel2);border-radius:4px;padding:1px 6px}
.c-act{display:flex;gap:6px;margin-top:auto}
.c-act .btn{flex:1}
.since{font:11px var(--f-mono);color:var(--mute)}
.empty{padding:36px 16px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:10px}

/* open posities, altijd zichtbaar */
.posbar{margin-top:12px;background:var(--panel);border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:10px;padding:10px 12px;display:grid;gap:8px;backdrop-filter:blur(8px)}
.pb-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pb-h b{font:700 13px var(--f-head);letter-spacing:.06em;text-transform:uppercase}
.pb-h .btn{margin-left:auto}
.pb-list{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.pb-i{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px}
.pb-s{background:none;border:0;padding:0;text-align:left}
.pb-s:hover b{color:var(--accent)}

/* tokennetwerk */
.netbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:14px}
.netbox-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;flex-wrap:wrap}
.netbox-h h2{font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.legend{display:flex;gap:14px;flex-wrap:wrap;font:11px var(--f-mono);color:var(--mute)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.netwrap{position:relative;height:clamp(320px,50vh,470px);margin-top:6px}
#net{width:100%;height:100%;display:block;cursor:default;touch-action:manipulation}
.nettip{position:absolute;z-index:3;pointer-events:none;background:var(--solid);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:12px var(--f-mono);white-space:nowrap;box-shadow:0 6px 24px rgb(0 0 0/.35)}
.nettip b{font:700 14px var(--f-head);display:block}

/* portfolio / tabellen */
.page{padding-top:16px;display:grid;gap:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile span{font:500 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.tile b{display:block;font:600 20px var(--f-head);margin-top:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.panel h2{font-size:14px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:10px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:500 10px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--mute);text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
td.r,th.r{text-align:right}
td .mono{font-size:12px}
.spark{width:100%;height:120px;display:block}
.two{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}

/* grootboek */
.ledger{display:flex;flex-direction:column;gap:0}
.lb{display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px}
.lb .rail{display:flex;flex-direction:column;align-items:center}
.lb .rail i{width:11px;height:11px;border-radius:50%;border:2px solid var(--accent);background:var(--bg);margin-top:16px;flex:none}
.lb .rail u{flex:1;width:2px;background:var(--chain)}
.lb .body{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;display:grid;gap:3px}
.lb .l1{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;justify-content:space-between}
.lb .l1 b{font:700 13px var(--f-head);letter-spacing:.04em}
.lb code{font:11px var(--f-mono);color:var(--mute);overflow-wrap:anywhere}
.tag{font:600 10px var(--f-mono);padding:1px 6px;border-radius:3px;letter-spacing:.06em}
.tag.buy{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}
.tag.sell{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.tag.gen{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgb(0 0 0/.5);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--solid);border-left:1px solid var(--line);z-index:50;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 16px;display:flex;flex-direction:column;gap:14px}
.d-head{display:flex;gap:12px;align-items:center}
.d-head .x{margin-left:auto}
.d-sec{display:grid;gap:8px}
.d-sec h3{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.risk{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.risk li{display:flex;gap:8px;font-size:13px;align-items:flex-start}
.risk li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--info)}
.risk .ok::before{background:var(--good)} .risk .warn::before{background:var(--warn)} .risk .bad::before{background:var(--bad)}
.ticket{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px}
.amts{display:flex;gap:6px;flex-wrap:wrap}
.q{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font:12px var(--f-mono)}
.q span:nth-child(odd){color:var(--mute)}
.q span:nth-child(even){text-align:right}
iframe.chart{width:100%;height:340px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:grid;gap:8px;width:min(440px,calc(100% - 32px))}
.toast{background:var(--panel2);border:1px solid var(--accent);border-radius:8px;padding:9px 12px;font-size:13px;box-shadow:0 8px 30px rgb(0 0 0/.35)}
.toast.bad{border-color:var(--bad)} .toast.good{border-color:var(--good)}
.note{font-size:12px;color:var(--mute)}

@media (max-width:980px){
  .scan{grid-template-columns:minmax(0,1fr)}
  .filters{position:static;max-height:none;display:none}
  .filters.open{display:block}
  .filt-toggle{display:inline-block}
  .two{grid-template-columns:minmax(0,1fr)}
  .wallet{margin-left:0;width:100%}
}
@media (max-width:700px){.top{position:static}.drawer{width:100%}}
@media (max-width:520px){.kv{grid-template-columns:repeat(2,1fr)} .grid{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<canvas id="amb-far" class="amb" aria-hidden="true"></canvas><canvas id="amb-near" class="amb" aria-hidden="true"></canvas>
<div id="app">
  <header class="top"><div class="wrap">

async function sha256(str) {
  try {
    if (crypto?.subtle) {
      const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
    }

    let h1 = 0xdeadbeef ^ s, h2 = 0x41c6ce57 ^ s;
    for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }

    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    out += (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0');
  }

}

/* ---------- normaliseren van DexScreener-paren ---------- */
function normPair(p) {

  const price = +p.priceUsd; if (!price) return null;
  const tx = p.txns || {}, v = p.volume || {}, c = p.priceChange || {};
  return {
    key: keyOf(p.chainId, b.address), chain: p.chainId, addr: b.address, pair: p.pairAddress, dex: p.dexId || '',
    sym: b.symbol || '?', name: b.name || '', quote: p.quoteToken?.symbol || '',

    liq: p.liquidity?.usd || 0, v24: v.h24 || 0, v6: v.h6 || 0, v1: v.h1 || 0,
    b24: tx.h24?.buys || 0, s24: tx.h24?.sells || 0, b1: tx.h1?.buys || 0, s1: tx.h1?.sells || 0,
    c5: c.m5 ?? 0, c1: c.h1 ?? 0, c6: c.h6 ?? 0, c24: c.h24 ?? 0,
    fdv: p.fdv || 0, mcap: p.marketCap || p.fdv || 0, created: p.pairCreatedAt || Date.now(),

  const best = new Map();
  for (const p of pairs) {

    if (wanted && !wanted.has(t.key)) continue;
    const o = best.get(t.key); if (!o || t.liq > o.liq) best.set(t.key, t);
  }

}
async function fetchPairsFor(keys) {
  const byChain = {};
  for (const k of keys) { const [c, ...a] = k.split(':'); (byChain[c] ||= []).push(a.join(':')); }
  const jobs = [];
  for (const [c, addrs] of Object.entries(byChain))
    for (let i = 0; i < addrs.length; i += 30)
      jobs.push(jget(`${DS}/tokens/v1/${encodeURIComponent(c)}/${addrs.slice(i, i + 30).map(encodeURIComponent).join(',')}`));
  const res = await Promise.allSettled(jobs);
  const pairs = res.filter(r => r.status === 'fulfilled' && Array.isArray(r.value)).flatMap(r => r.value);
  if (jobs.length && !pairs.length && res.every(r => r.status === 'rejected')) throw new Error('DexScreener niet bereikbaar');
  return bestPerToken(pairs, new Set(keys));
}
async function liveScan() {

/* ---------- risico: heuristieken op DexScreener-data + externe audits ---------- */
function heuristics(t) {
  const out = []; const ageH = (t.ts - t.created) / 36e5; const add = (l, m) => out.push({l, t: m});
  if (t.liq < 5000) add('bad', `Liquiditeit extreem laag (${usd(t.liq)})`);
  else if (t.liq < 15000) add('warn', `Dunne liquiditeit (${usd(t.liq)})`);
  if (t.s24 === 0 && t.b24 >= 20) add('bad', 'Geen enkele verkoop gezien: typisch honeypot-patroon');
  else if (t.b24 >= 100 && t.s24 / (t.b24 + t.s24) < 0.12) add('warn', 'Opvallend weinig verkopen t.o.v. kopen');
  if (ageH < 1) add('warn', 'Pool is jonger dan 1 uur');
  if (t.liq > 0 && t.v24 / t.liq > 60) add('warn', `Volume is ${(t.v24 / t.liq).toFixed(0)}× de liquiditeit: mogelijke wash trading`);
  if (t.mcap > 0 && t.liq / t.mcap < 0.01) add('warn', 'Liquiditeit is minder dan 1% van de marktcap');
  if (t.c1 < -50) add('bad', `Koers ${t.c1.toFixed(0)}% in 1 uur: dump of rug bezig`);
  if (t.c24 > 1500) add('warn', `Parabolische pump (+${t.c24.toFixed(0)}% in 24u)`);
  const peak = S.seen[t.key]?.peakLiq;
  if (peak && t.liq < peak * 0.4) add('bad', `Liquiditeit ${Math.round((1 - t.liq / peak) * 100)}% onder de piek: pool wordt leeggehaald`);
  if (!t.web && !t.soc) add('info', 'Geen website of socials bij DexScreener');
  return out;
}
function riskOf(t) {
  const items = heuristics(t); const s = S.sec[t.key]; let metrics = {}, checked = false;
  if (s) { items.push(...s.items); metrics = s.metrics || {}; checked = s.ok; }
  const verdict = items.some(i => i.l === 'bad') ? 'bad' : items.some(i => i.l === 'warn') ? 'warn' : checked ? 'ok' : 'unknown';
  return {items, verdict, checked, metrics, pending: !s && !!S.pending[t.key]};
}
function scoreOf(t, risk) {

  const lg = (x, lo, hi) => clamp(Math.log10(Math.max(x, 1) / lo) / Math.log10(hi / lo), 0, 1);

function evaluate(t, o = {}) {

  F(!f.maxMcap || t.mcap <= f.maxMcap, `MCap > ${usd(f.maxMcap, 0)}`);
  F(t.c1 >= f.minCh1, `1u < ${f.minCh1}%`);
  F(!f.maxCh24 || t.c24 <= f.maxCh24, `24u > ${f.maxCh24}%`);
  F(bs >= f.minBuy && bs <= f.maxBuy, `Koopaandeel ${bs.toFixed(0)}%`);
  F(!t.mcap || (t.liq / t.mcap * 100) >= f.minLiqMcap, 'Liq/mcap laag');
  F(!f.maxVolLiq || t.v24 / Math.max(t.liq, 1) <= f.maxVolLiq, 'Volume/liq te hoog');
  F(!f.needSocial || t.web || t.soc, 'Geen socials');

  F(score >= f.minScore, `Score ${score} < ${f.minScore}`);
  if (f.secMode !== 'off' && !o.skipSec) {

    else {

      F(risk.verdict !== 'bad', bad ? bad.t : 'Rode vlag');

async function runSec(tokens, concurrency = 3) {
  const q = tokens.filter(t => !S.sec[t.key] || Date.now() - S.sec[t.key].ts > SEC_TTL).filter(t => !S.pending[t.key]);
  q.forEach(t => S.pending[t.key] = 1);
  let i = 0;
  const worker = async () => {
    while (i < q.length) {
      const t = q[i++];
      try { S.sec[t.key] = S.mode === 'demo' ? Demo.sec(t) : await secCheck(t); }
      catch (e) { S.sec[t.key] = {ts: Date.now(), ok: false, items: [{l: 'info', t: 'Check mislukt: ' + e.message}], metrics: {}, src: []}; }
      delete S.pending[t.key]; render();
    }
  };
  await Promise.all(Array.from({length: Math.min(concurrency, q.length)}, worker));
  saveSoon();
}

async function scan() {

    let toks;

    catch (e) {

      throw e;
    }
    if (!toks.length) throw new Error('Geen tokens ontvangen');
    toks.forEach(t => { noteSeen(t); S.tokens[t.key] = t; });
    // blok samenstellen: de 40 beste op marktscore
    const ranked = toks.map(t => ({t, s: evaluate(t, {skipSec: true})})).sort((a, b) => b.s.score - a.s.score);
    const top = ranked.slice(0, 40).map(x => x.t);

      setStatus(`Beveiligingschecks voor ${need.length} tokens…`);
      await Promise.race([runSec(need), sleep(28000)]);
    }
    await mineBlock(top, toks.length);
    if (S.settings.auto.on) await autoTrade();
    await markPortfolio();
    lastScanInfo = '';
  } catch (e) {
    lastScanInfo = 'Scan mislukt: ' + e.message; toast(lastScanInfo, 'bad');
  } finally {
    S.scanning = false; nextScanAt = Date.now() + S.settings.scanSec * 1000; nextRefreshAt = Date.now() + S.settings.refreshSec * 1000;

}
async function mineBlock(tokens, total) {

  const keys = tokens.map(t => t.key), merkle = await sha256(keys.join('|'));

  const passed = tokens.filter(t => evaluate(t).pass).length;
  S.blocks.push({h, hash, prev, ts, merkle, nonce, total, passed, snap: tokens}); Net.pulse();
  if (S.blocks.length > 24) S.blocks.shift();

}
async function verifyChain(list, kind) {
  let prev = null;
  for (const b of list) {
    if (prev && b.prev !== prev.hash) return {ok: false, at: b.h};
    const payload = kind === 'scan' ? b.prev + b.ts + b.merkle + b.nonce : b.prev + b.ts + JSON.stringify(b.tx) + b.nonce;
    if (await sha256(payload) !== b.hash) return {ok: false, at: b.h};
    if (kind === 'scan' && await sha256(b.snap.map(t => t.key).join('|')) !== b.merkle) return {ok: false, at: b.h};
    prev = b;

/* ---------- paper trading ---------- */
const gas = c => GAS[c] ?? .1;
function quoteBuy(t, amount, m = {}) {
  const R = Math.max(t.liq, 1) / 2, impact = amount / (R + amount);
  const fee = amount * DEX_FEE + gas(t.chain), net = Math.max(0, amount - fee);
  const tax = (m.buyTax || 0) / 100, exec = t.price * (1 + amount / R);
  return {amount, fee, impact, exec, tax, qty: net * (1 - tax) / exec};
}
function quoteSell(pos, t, frac, m = {}) {
  const qty = pos.qty * frac, gross = qty * t.price, R = Math.max(t.liq, 1) / 2, impact = gross / (R + gross);
  const exec = t.price * R / (R + gross), tax = (m.sellTax || 0) / 100;
  const out = qty * exec * (1 - tax), fee = out * DEX_FEE + gas(t.chain);
  return {qty, impact, exec, tax, fee, net: Math.max(0, out - fee)};
}
const equity = () => S.pf.cash + S.pf.pos.reduce((a, p) => a + p.qty * p.last, 0);

async function ensureGenesis() {

}
async function doBuy(key, amount, o = {}) {

  if (risk.metrics.honeypot) return {ok: false, msg: 'Geblokkeerd: dit token is een honeypot, je zou niet kunnen verkopen'};
  const q = quoteBuy(t, amount, risk.metrics);

async function markPortfolio() {

}

  const root = $('#drawer-root'); const key = S.ui.drawer;
  if (!key) { root.innerHTML = ''; return; }
  const t = S.tokens[key] || findToken(key); if (!t) { root.innerHTML = ''; return; }
  const ev = evaluate(t), r = ev.risk, pos = S.pf.pos.find(p => p.key === key), tr = S.settings.trade;
  const ageH = (Date.now() - t.created) / 36e5;
  root.innerHTML = `<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-label="${esc(t.sym)} details">
    <div class="d-head">${iconHtml(t)}<div><h2>${esc(t.sym)} <small class="mute" style="font:12px var(--f-body)">${esc(t.name)}</small></h2><div class="mono mute" style="font-size:11px">${chainBadge(t.chain)} ${esc(t.dex)} · ${esc(shortA(t.addr))} <button class="btn sm" data-act="copy" data-v="${esc(t.addr)}">kopieer</button></div></div>${ring(ev.score)}<button class="btn sm x" data-act="close" aria-label="Sluiten">Sluit</button></div>
    <div class="c-price"><b id="d-price" style="font:600 22px var(--f-mono)">${px(t.price)}</b><span id="d-ch">${pct(t.c1)} 1u · ${pct(t.c24, 0)} 24u</span></div>
    <div class="kv" style="grid-template-columns:repeat(3,1fr)"><div><span>Liquiditeit</span><b>${usd(t.liq)}</b></div><div><span>Volume 24u</span><b>${usd(t.v24)}</b></div><div><span>MCap</span><b>${usd(t.mcap)}</b></div><div><span>Leeftijd</span><b>${ageStr(ageH)}</b></div><div><span>Kopen/verkopen</span><b>${t.b24}/${t.s24}</b></div><div><span>Holders</span><b>${r.metrics.holders ? r.metrics.holders.toLocaleString('nl-NL') : '–'}</b></div></div>
    <div class="d-sec"><h3>Honeypot- en rugcheck</h3><div class="pills">${verdictPill(r)}${ev.pass ? '<span class="pill ok">Gevalideerd</span>' : '<span class="pill unk">Afgekeurd</span>'}<button class="btn sm" data-act="recheck" data-k="${esc(key)}">Opnieuw checken</button></div>
      <ul class="risk">${r.items.length ? r.items.map(i => `<li class="${i.l}">${esc(i.t)}</li>`).join('') : '<li>Nog geen check uitgevoerd. Klik op Opnieuw checken.</li>'}</ul>
      ${S.sec[key] ? `<div class="note">Bronnen: ${esc((S.sec[key].src || []).join(', ') || 'geen')} · ${hhmmss(S.sec[key].ts)}</div>` : ''}
      ${!ev.pass ? `<div class="fails">${ev.fails.map(x => `<span>${esc(x)}</span>`).join('')}</div>` : ''}</div>
    ${pos ? `<div class="ticket"><h3 style="font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)">Jouw positie</h3><div class="q" id="d-pos"></div><div class="amts"><button class="btn sm" data-act="sell" data-id="${pos.id}" data-f="0.25">25%</button><button class="btn sm" data-act="sell" data-id="${pos.id}" data-f="0.5">50%</button><button class="btn sm bad" data-act="sell" data-id="${pos.id}" data-f="1">Alles verkopen</button></div></div>` : ''}
    <div class="ticket"><h3 style="font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)">Paper trade: koop</h3>
      <div class="amts">${[100, 250, 500, 1000].map(v => `<button class="btn sm" data-act="amt" data-v="${v}">$${v}</button>`).join('')}<button class="btn sm" data-act="amt" data-v="max">Max</button></div>
      <div class="fgrid"><div class="fld"><label for="t-amt">Bedrag ($)</label><input type="number" id="t-amt" value="${Math.min(tr.size, Math.floor(S.pf.cash))}" min="0" step="25"></div><div class="fld"><label for="x-tp">Take profit (%)</label><input type="number" id="x-tp" value="${tr.tp}"></div><div class="fld"><label for="x-sl">Stop loss (%)</label><input type="number" id="x-sl" value="${tr.sl}"></div><div class="fld"><label for="x-trail">Trailing stop (%)</label><input type="number" id="x-trail" value="${tr.trail}"></div></div>
      <div class="q" id="d-quote"></div>
      <button class="btn good" id="d-buy" data-act="buy" data-k="${esc(key)}">Koop met papiergeld</button>
      <div class="note" id="d-msg"></div></div>
    <div class="d-sec"><h3>Grafiek</h3>${S.ui.chart && t.pair ? `<iframe class="chart" title="DexScreener grafiek" src="https://dexscreener.com/${encodeURIComponent(t.chain)}/${encodeURIComponent(t.pair)}?embed=1&theme=dark&trades=0&info=0"></iframe>` : '<button class="btn sm" data-act="chart">Toon grafiek</button>'}
      ${t.url ? `<a href="${esc(t.url)}" target="_blank" rel="noopener noreferrer" class="note">Open op DexScreener</a>` : ''}</div>
  </aside>`;
  $('#t-amt').addEventListener('input', updateQuote); updateQuote(); updateDrawerLive();
}
function updateQuote() {
  const key = S.ui.drawer, t = S.tokens[key] || findToken(key); if (!t || !$('#d-quote')) return;
  const amt = +$('#t-amt').value || 0, m = riskOf(t).metrics, q = quoteBuy(t, amt, m);
  $('#d-quote').innerHTML = `<span>Prijsimpact</span><span class="${q.impact > .05 ? 'dn' : ''}">${(q.impact * 100).toFixed(2)}%</span><span>Uitvoeringsprijs</span><span>${px(q.exec)}</span><span>Kosten (swap + gas)</span><span>${money(q.fee)}</span><span>Buy tax</span><span>${(q.tax * 100).toFixed(1)}%</span><span>Je krijgt</span><span>${qtyFmt(q.qty)} ${esc(t.sym)}</span>`;
  const b = $('#d-buy'); b.disabled = !(amt > 0) || amt > S.pf.cash || !!m.honeypot;
  $('#d-msg').textContent = m.honeypot ? 'Kopen is geblokkeerd: honeypot.' : amt > S.pf.cash ? `Saldo ${money(S.pf.cash)} is te laag.` : q.impact > .05 ? 'Hoge prijsimpact: de pool is klein t.o.v. je bedrag.' : '';
}
function updateDrawerLive() {
  const key = S.ui.drawer; if (!key || !$('#d-price')) return;
  const t = S.tokens[key]; if (!t) return;
  $('#d-price').textContent = px(t.price); $('#d-ch').innerHTML = `${pct(t.c1)} 1u · ${pct(t.c24, 0)} 24u`;
  const pos = S.pf.pos.find(p => p.key === key), el = $('#d-pos');
  if (pos && el) { const val = pos.qty * pos.last, r = (val / pos.cost - 1) * 100; el.innerHTML = `<span>Inleg</span><span>${money(pos.cost)}</span><span>Instap</span><span>${px(pos.entry)}</span><span>Waarde nu</span><span>${money(val)}</span><span>Resultaat</span><span>${pct(r)}</span>`; }
  updateQuote();
}

/* ---------- renderen ---------- */
let rAF = 0;
function render() { if (rAF) return; rAF = requestAnimationFrame(() => { rAF = 0; renderNow(); }); }
function renderNow() {
  updateTop(); const tab = S.ui.tab;
  for (const id of ['scanner', 'portfolio', 'ledger', 'settings']) $('#v-' + id).hidden = id !== tab;
  $$('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.v === tab));
  if (tab === 'scanner') { renderScanner(); renderChainChips(); }
  if (tab === 'portfolio') renderPortfolio();
  renderPosBar();
}
function toast(msg, kind = '') {
  const el = document.createElement('div'); el.className = 'toast ' + kind; el.textContent = msg; $('#toasts').append(el);
  setTimeout(() => el.remove(), 5200);
}

function openToken(key) {
  S.ui.drawer = key; S.ui.chart = false; renderDrawer();
  const t = S.tokens[key] || findToken(key);
  if (t && !S.sec[key] && !S.pending[key]) runSec([t], 1).then(() => S.ui.drawer === key && renderDrawer());
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act, d = b.dataset;
  switch (a) {
    case 'tab': S.ui.tab = d.v; if (d.v === 'ledger') renderLedger(); if (d.v === 'settings') renderSettings(); renderNow(); saveSoon(); window.scrollTo(0, 0); break;
    case 'scan': scan(); break;
    case 'mode': if (d.v !== S.mode) switchMode(d.v); else if (S.mode === 'demo' && b.closest('.banner')) switchMode('live'); break;
    case 'filt': $('#filters').classList.toggle('open'); break;
    case 'block': S.ui.sel = +d.v === S.blocks.at(-1).h ? null : +d.v; render(); break;
    case 'preset': S.preset = d.v; Object.assign(S.filters, PRESETS[d.v].f); buildFilters(); filterChanged(); break;
    case 'chain': {
      const c = S.filters.chains; if (d.v === '*') c.length = 0; else { const i = c.indexOf(d.v); i >= 0 ? c.splice(i, 1) : c.push(d.v); }
      S.preset = ''; renderChainChips(); filterChanged(); break;
    }
    case 'open': openToken(d.k); break;
    case 'sellall':
      if (S.ui.armAll && Date.now() - S.ui.armAll < 4000) { S.ui.armAll = 0; await sellAll(); }
      else { S.ui.armAll = Date.now(); renderPosBar(); setTimeout(renderPosBar, 4100); }
      break;
    case 'view': S.ui.view = d.v; render(); saveSoon(); break;
    case 'close': S.ui.drawer = null; renderDrawer(); break;
    case 'check': { const t = S.tokens[d.k] || findToken(d.k); if (t) { delete S.sec[d.k]; toast(`Check gestart voor ${t.sym}…`); await runSec([t], 1); } break; }
    case 'recheck': { const t = S.tokens[d.k] || findToken(d.k); if (t) { delete S.sec[d.k]; renderDrawer(); await runSec([t], 1); renderDrawer(); } break; }
    case 'amt': $('#t-amt').value = d.v === 'max' ? Math.floor(S.pf.cash) : d.v; updateQuote(); break;
    case 'chart': S.ui.chart = true; renderDrawer(); break;
    case 'copy': try { await navigator.clipboard.writeText(d.v); toast('Adres gekopieerd'); } catch (er) { toast('Kopiëren is niet gelukt', 'bad'); } break;
    case 'buy': {
      b.disabled = true;
      const r = await doBuy(d.k, $('#t-amt').value, {tp: $('#x-tp').value, sl: $('#x-sl').value, trail: $('#x-trail').value});
      toast(r.msg, r.ok ? 'good' : 'bad'); if (r.ok) { S.ui.tab === 'portfolio' && renderPortfolio(); renderDrawer(); } else b.disabled = false; render(); break;
    }
    case 'sell': { const r = await doSell(+d.id, +d.f); toast(r.msg, r.ok ? (r.pnl >= 0 ? 'good' : 'bad') : 'bad'); if (S.ui.drawer) renderDrawer(); render(); break; }
    case 'verify': { const r = await verifyChain(S.blocks, 'scan'); $('#verify-out').innerHTML = r.ok ? `<span class="up">Geldig: ${r.n} blokken kloppen</span>` : `<span class="dn">Keten gebroken bij blok #${r.at}</span>`; break; }
    case 'lverify': { const r = await verifyChain(S.ledger, 'ledger'); $('#lverify').innerHTML = r.ok ? `<span class="up">Geldig: ${r.n} blokken kloppen</span>` : `<span class="dn">Keten gebroken bij blok #${r.at}</span>`; break; }
    case 'clearsec': S.sec = {}; toast('Check-cache gewist'); saveSoon(); break;
    case 'reset':
      if (b.dataset.armed) {
        S.pf = {cash: S.settings.startCash, start: S.settings.startCash, pos: [], hist: [], eq: [], fees: 0}; S.ledger = []; await ensureGenesis();
        saveSoon(); toast('Portfolio gereset'); renderSettings(); render();
      } else { b.dataset.armed = 1; b.textContent = 'Zeker weten? Klik nogmaals'; setTimeout(() => { delete b.dataset.armed; b.textContent = 'Reset portfolio en grootboek'; }, 4000); }
      break;
  }
});
document.addEventListener('input', e => {
  const el = e.target; const k = el.dataset.f; if (!k) return;
  S.filters[k] = el.type === 'checkbox' ? el.checked : el.tagName === 'SELECT' ? el.value : (+el.value || 0);
  S.preset = ''; $$('[data-act="preset"]').forEach(b => b.setAttribute('aria-pressed', false)); filterChanged();
});
$('#q').addEventListener('input', e => { S.ui.q = e.target.value; render(); });
$('#sort').addEventListener('change', e => { S.ui.sort = e.target.value; render(); saveSoon(); });
$('#onlypass').addEventListener('change', e => { S.ui.onlyPass = e.target.checked; render(); saveSoon(); });
$('#autoscan').addEventListener('change', e => { S.settings.autoScan = e.target.checked; if (e.target.checked) nextScanAt = Date.now() + 2000; updateTop(); saveSoon(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.ui.drawer) { S.ui.drawer = null; renderDrawer(); } });

async function switchMode(mode, fallback = false) {
  save(); S = loadState(mode); S.fallback = fallback; localStorage.setItem('chainscout.mode', mode);
  await ensureGenesis(); syncControls(); buildFilters(); renderDrawer(); renderNow(); nextScanAt = 0; nextRefreshAt = Date.now() + 15000;
  if (S.ui.tab === 'ledger') renderLedger(); if (S.ui.tab === 'settings') renderSettings();
  scan();
}
function syncControls() {
  $('#sort').value = S.ui.sort; $('#onlypass').checked = S.ui.onlyPass; $('#autoscan').checked = S.settings.autoScan; $('#q').value = S.ui.q;
}
function tick() {
  const now = Date.now();
  if (!S.scanning && S.settings.autoScan && nextScanAt && now >= nextScanAt) scan();
  else if (!S.scanning && !S.refreshing && nextRefreshAt && now >= nextRefreshAt) refreshPrices();
  updateTop();
}
(async function init() {
  let mode = 'live'; try { mode = localStorage.getItem('chainscout.mode') || 'live'; } catch (e) {}
  S = loadState(mode === 'demo' ? 'demo' : 'live');
  await ensureGenesis(); syncControls(); buildFilters(); renderNow();
  if (S.ui.tab === 'ledger') renderLedger(); if (S.ui.tab === 'settings') renderSettings();
  setInterval(tick, 1000); window.addEventListener('beforeunload', save);
  scan();
})();
</script>
</body>
</html>
